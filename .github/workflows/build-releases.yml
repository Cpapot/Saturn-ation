name: Build Releases (Windows & macOS)

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'

jobs:
  # ============================================================================
  # Windows Build (x64)
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    name: Build Windows (x64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize JUCE submodule
        run: |
          if (-not (Test-Path "JUCE/CMakeLists.txt")) {
            Write-Host "JUCE submodule not found, cloning from GitHub..."
            git submodule add https://github.com/juce-framework/JUCE.git JUCE
            git submodule update --init --recursive
          } else {
            Write-Host "JUCE submodule already initialized"
            git submodule update --init --recursive
          }
        shell: powershell

      - name: Install dependencies (CMake + Ninja)
        shell: powershell
        run: |
          choco install -y cmake ninja
          refreshenv
          cmake --version
          ninja --version

      - name: Build Release (Windows)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
        env:
          CI: true

      - name: Collect Windows artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null

          $src = "build\Saturnation_artefacts\Release"
          if (Test-Path $src) {
            Copy-Item -Recurse -Force "$src\*" "artifacts\windows\"
          } else {
            Write-Host "Artefacts directory not found: $src"
          }

          if (Test-Path "build\vst3_output") {
            New-Item -ItemType Directory -Force -Path artifacts/windows/vst3 | Out-Null
            Copy-Item -Recurse -Force "build\vst3_output\*" "artifacts\windows\vst3\"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows/
          retention-days: 1

  # ============================================================================
  # macOS Build (ARM64 - Apple Silicon M1/M2/M3)
  # ============================================================================
  build-macos:
    runs-on: macos-latest
    name: Build macOS (ARM64)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize JUCE submodule
        run: |
          if [ ! -f "JUCE/CMakeLists.txt" ]; then
            echo "JUCE submodule not found, cloning from GitHub..."
            git submodule add https://github.com/juce-framework/JUCE.git JUCE
            git submodule update --init --recursive
          else
            echo "JUCE submodule already initialized"
            git submodule update --init --recursive
          fi

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Build Release (macOS ARM64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release
        env:
          CI: true

      - name: Collect macOS artifacts
        run: |
          mkdir -p artifacts/macos
          cp -r build/Saturnation_artefacts/Release/* artifacts/macos/ 2>/dev/null || echo "Warning: Saturnation_artefacts not found"
          if [ -d "build/vst3_output" ]; then
            mkdir -p artifacts/macos/vst3
            cp -r build/vst3_output/* artifacts/macos/vst3/
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos/
          retention-days: 1

  # ============================================================================
  # Create Release with Artifacts
  # ============================================================================
  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    name: Create Release
    
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos/

      - name: Create ZIP archives
        run: |
          mkdir -p releases
          cd artifacts
          zip -r ../releases/Saturn-ation-Windows-x64.zip windows/
          zip -r ../releases/Saturn-ation-macOS-ARM64.zip macos/
          cd ../releases
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Optional: Continuous Artifacts (Latest build on every push)
  # ============================================================================
  upload-latest:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    name: Update Latest Build
    
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts/windows/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos/

      - name: Create ZIP archives
        run: |
          mkdir -p releases
          cd artifacts
          zip -r ../releases/Saturn-ation-Windows-x64-latest.zip windows/
          zip -r ../releases/Saturn-ation-macOS-ARM64-latest.zip macos/

      - name: Upload to releases (Overwrite latest)
        uses: softprops/action-gh-release@v1
        with:
          files: releases/*
          tag_name: latest
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
